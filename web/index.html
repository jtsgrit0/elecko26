<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="2026 지방선거 당선 예측 플랫폼">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="2026 당예기">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>2026 당예기</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #ffffff;
      transition: opacity 0.5s ease-out;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #D63031;
      margin-top: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(214, 48, 49, 0.1);
      border-left-color: #D63031;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="assets/assets/images/election_icon.png" class="logo" alt="Logo">
    <div class="spinner"></div>
    <div class="loading-text">2026 당예기 불러오는 중...</div>
  </div>

  <script>
    // 10초 후 무조건 스플래시 제거 (엔진 로드 실패 대비)
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) {
        console.log('Splash force removed after 10s');
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 10000);

    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const engine = await engineInitializer.initializeEngine();
        await engine.runApp();
        
        // 엔진이 로드되고 앱이 실행될 준비가 되면 스플래시 화면 제거
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => {
            splash.remove();
          }, 500);
        }
      }
    });
  </script>
</body>
</html>
