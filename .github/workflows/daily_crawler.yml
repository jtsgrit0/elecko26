name: Daily Election Crawler

on:
  schedule:
    # 15:00 UTC는 한국 시간으로 자정(00:00)입니다.
    - cron: '0 15 * * *'
  workflow_dispatch: # 수동 실행을 위한 옵션

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: 패키지 설치
        run: flutter pub get

      - name: 크롤러 실행
        run: ${FLUTTER_ROOT}/bin/dart run tools/crawler.dart

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/election_candidates.json
          git commit -m "🤖 [자동업데이트] 2026 지방선거 출마 후보 크롤링 및 업데이트" || echo "변경된 사항이 없습니다."
          git push
