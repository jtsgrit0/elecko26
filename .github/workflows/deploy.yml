name: Deploy to GitHub Pages
# This is a test comment to trigger GitHub Actions

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Comprehensive Diagnostics
        run: |
          echo "--- Git LFS Environment ---"
          git lfs env
          echo "--- Git LFS Status ---"
          git lfs status
          echo "--- Recursive Directory Listing ---"
          ls -R
          echo "--- End of Diagnostics ---"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # .fvm/fvm_config.json 와 동일한 버전
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /elecko26/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web