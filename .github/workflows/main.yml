name: Flutter CI

on:
  push:
    branches:
      - master # master 브랜치에 푸시될 때 워크플로우 실행

jobs:
  build:
    runs-on: ubuntu-latest # Ubuntu 환경에서 실행

    steps:
      - uses: actions/checkout@v4 # 저장소 체크아웃
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # 사용하는 Flutter 버전에 맞게 변경 (예: '3.19.x' 또는 '3.22.x')
          channel: 'stable' # Flutter 채널 설정 (stable, beta, dev)
      - name: Install dependencies
        run: flutter pub get # Flutter 패키지 설치
      - name: Run tests
        run: flutter test # 테스트 실행
      - name: Build Web
        run: flutter build web --release # 웹 버전 빌드
